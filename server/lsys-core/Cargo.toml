[package]
name = "lsys-core"
version = "0.0.1"
authors = ["liushan <shan.liu@msn.com>"]
edition = "2024"


[dev-dependencies]
tokio = { version = "~1.52.0", features = ["rt", "macros", "io-util"] }

[dependencies]

futures-util = "~0.3.31"
dotenv = "~0.15.*"
serde = { version = "~1.0.*", features = ["derive"] }
serde_json = "~1.0.*"

log = "~0.4.*"

#日志
tracing = { version = "~0.1.*", features = [
    "log",
], optional = true } # log-always 保持log的输出 当使用tracing时会出现两次
tracing-attributes = { version = "~0.1.*", optional = true } #日志属性宏
tracing-appender = { version = "~0.2.*", optional = true } #写日志文件
tracing-subscriber = { version = "~0.3.*", features = ["env-filter"], optional = true }

#模板


#代替标准库的锁
parking_lot = "~0.12.*"


fluent = "~0.17.*"
unic-langid = { version = "~0.9.*", features = ["unic-langid-macros"] }
intl-memoizer = "~0.5.2"


async-trait = "~0.1.*"


rand = "~0.10.0"


config = "~0.15"


hashlink = "~0.11"
hostname = "~0.4.0"
uuid = { version = "~1.23.1", features = ["v4"], optional = true }


chrono = { version = "~0.4.38", features = ["serde"] }


rs-snowflake = "~0.6.0"
crc32fast = "~1.5.0"

md5 = "~0.8.0"
form_urlencoded = "~1.2.0"

num_cpus = "~1.17.0"

lazy_static = "1.5.0"

regex = "1.11.1"

tokio = { version = "~1.52.0", features = ["fs", "macros", "sync", "io-util", "rt", "time"], optional = true }

tokio-util = { version = "~0.7", optional = true }

# Queue Cache Layer dependencies
flume = { version = "~0.11", optional = true }
yaque = { version = "~0.6", optional = true }
lapin = { version = "~2.5.0", optional = true }
proptest = { version = "~1.7.0", optional = true }

lsys-macros-db = { path = "../lsys-macros-db", optional = true }
#db
sqlx = { version = "~0.8.6", features = [
    "runtime-tokio-native-tls",
], optional = true }

tera = { version = "~1.20", optional = true }

base64 = { version = "~0.22", optional = true }
hex = { version = "~0.4", optional = true }
aes-gcm = { version = "~0.10", optional = true }
hmac = { version = "~0.13.0", optional = true }
sha2 = { version = "~0.11.0", optional = true }


deadpool-redis = { version = "~0.23.0", optional = true }
redis = { version = "~1.0.3", features = [ # 根据 deadpool-redis 的版本适配 
    "aio",
    "tokio-comp",
    "connection-manager",
], optional = true }


[features]
default = []
tokio = ["dep:tokio"]
tracing = ["dep:tracing", "dep:tracing-attributes", "dep:tracing-appender", "dep:tracing-subscriber"]
db = ["dep:sqlx", "dep:lsys-macros-db", "tokio"]
db-mysql = ["db", "sqlx/mysql"]
db-postgres = ["db", "sqlx/postgres"]
db-sqlite = ["db", "sqlx/sqlite"]
tera = ["dep:tera", "tracing"]
redis = ["dep:redis", "dep:deadpool-redis", "dep:tokio-util", "dep:uuid", "tokio", "tracing"]
secret = ["dep:base64", "dep:hex", "tokio"]
field-encrypt = ["secret", "dep:aes-gcm", "dep:hmac", "dep:sha2"]
queue-cache = ["tokio", "tracing", "dep:flume"]
queue-cache-yaque = ["queue-cache", "dep:yaque"]
queue-cache-rabbitmq = ["queue-cache", "dep:lapin"]
queue-cache-test = ["queue-cache", "dep:proptest"]