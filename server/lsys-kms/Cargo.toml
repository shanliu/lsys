[package]
name = "lsys-kms"
version = "0.1.0"
edition = "2024"

[dependencies]
lsys-core = { path = "../lsys-core", features = ["secret"] }
async-trait = "0.1"
serde_json = "1.0"
base64 = "~0.22"

# HTTP client for KMS calls
reqwest = { version = "~0.13", features = ["json"] }

# For HMAC-SHA256 signing (used by cloud providers)
hmac-sha256 = "1.1"

[features]
default = []
aliyun-kms = []
tencent-kms = []

[dev-dependencies]
tokio = { version = "~1.52", features = ["full"] }
