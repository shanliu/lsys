[package]
name = "lsys-user"
version = "0.0.1"
authors = ["liushan <shan.liu@msn.com>"]
edition = "2024"

[dependencies]
tokio = { version = "~1.49.0" }
deadpool-redis = { version = "~0.23.0" }
redis = { version = "~1.0.3" }
lsys-core = { path = "../lsys-core", features = ["db-mysql", "redis"] }
#lsys-app = { path = "../lsys-app" }
lsys-setting = { path = "../lsys-setting" }
lsys-logger = { path = "../lsys-logger" }
lsys-access = { path = "../lsys-access" }
lsys-mfa = { path = "../lsys-mfa" }
sqlx = { version = "~0.8.6", features = ["mysql", "runtime-tokio-native-tls"] }


async-trait = "~0.1.*"


serde = { version = "1.0.*" }
serde_json = "1.0.*"
futures-util = "0.3.*"


md5 = "~0.8.*"
base64 = "0.22.1"


tracing = { version = "~0.1.*" } # log-always 保持log的输出 当使用tracing时会出现两次


hashlink = "~0.11"

hostname = "~0.4.*"


ip2location = "~0.6"


config = "~0.15"


[dev-dependencies]
tokio = { version = "~1.49.0", features = ["test-util"] }
