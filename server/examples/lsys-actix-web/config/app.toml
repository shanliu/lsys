#app_env="development"
#app_ssl_cert = "config/lsys.cc_bundle.crt"
#app_ssl_key = "config/lsys.cc.key"
#日志配置
log_level = "sqlx_core=info,lsys_app_sender=debug,lsys_app=trace,axtix_web=debug,actix=info,mio=error,lsys_access=trace,lsys_web=trace,lsys_core=trace,lsys_user=trace,lsys_rbac=trace,lsys_docs=trace,lsys_actix_web=trace,lsys_file=trace,lsys_file_manager=trace,sqlx=trace,redis=debug"
log_dir = "logs"
log_name = "app"
#数据库配置
#database_url="mysql://root:000@127.0.0.1:3306/test"
#redis 配置
#redis_url="redis://127.0.0.1/"

#是否使用LUA缓存
use_cache = false


#静态文件目录
ui_dir = "../../../ui/public/"
#静态文件访问路径,默认:/ui/
#ui_path="/ui/"
ui_path = "/"
#404页面渲染ui首页
ui_404_file = "app.html"

#超级管理员id,user表id
root_user_id = [1]

#语言文件目录
fluent_dir = "locale/"

#页面模板目录
tpl_dir = "./static"

#静态文件保存目录
static_file_dir = "./static"

#地址库数据文件压缩包
area_code_db = "data/2023-7-area-code.csv.gz"
#地址库数据文件压缩包
area_geo_db = "data/2023-7-area-geo.csv.gz"
#地址库索引文件目录
# area_index_dir = "/tmp/area_index"
#地址库索引时使用内存大小
# area_index_size = 500_000_000

# ip城市数据
# 下载以下文件解压后得到
# IP2LOCATION-LITE-DB11.BIN.zip 
ip_city_db = "data/IP2LOCATION-LITE-DB11.BIN"

#发送邮件 短信 生成唯一ID用
#snowflake_machine_id=1 #最大31
#snowflake_node_id=1 #最大31


# 登录会话数量限制（按 login_type 单独配置，key = login_type，value = 最多保留的有效会话数）
# 超出时踢出该类型中最早登录的会话；不配置或值为 0 = 不限制
# [login_max_per_type]
# name = 3
# email = 5
# mobile = 2

[secret.login_key]
source = "plain"
value  = "raw:bbb"

[secret.file_key_salt]
source = "plain"
value  = "raw:your-file-salt"

# 字段加密密钥（用于 Email/Mobile/SMTP密码 等敏感数据加密）
# 生成方式: openssl rand -hex 32
# 注意: 密钥必须是32字节（64个十六进制字符）
[secret.field_encrypt_key]
source = "plain"
value  = "hex:6368616e67652d746869732d746f2d796f757273656372657421213233343536373839303132333435363738393031"

# 密码 pepper（可选，增强用户密码哈希安全性）
[secret.password_pepper]
source = "plain"
value  = "raw:kkkkkkkkk"

# 生产环境推荐使用 KMS 加密密钥:
# [secret.field_encrypt_key]
# source     = "kms"
# kms        = "aliyun"  # 或 "tencent"
# ciphertext = "base64:AQICAHhPTpXk8xY3..."

# ===== KMS 配置（可选）=====
# 阿里云 KMS 配置
# [kms_aliyun]
# access_key_id     = "your-access-key-id"
# access_key_secret = "your-access-key-secret"
# region             = "cn-beijing"  # 支持: cn-beijing, cn-shanghai, cn-shenzhen, cn-hong-kong, ap-southeast-1

# 腾讯云 KMS 配置
# [kms_tencent]
# secret_id = "your-secret-id"
# secret_key = "your-secret-key"
# region    = "ap-beijing"  # 支持: ap-beijing, ap-shanghai, ap-guangzhou, ap-hongkong, ap-singapore

#接口允许域名
api_allow_origin = "*"

service_api_key = "xxx"

# 文件服务配置
# 存储基础路径，public/private/crypto 子目录会自动派生（默认: /tmp）
file_storage_base_path = "./data/files"
# 清理开关 (默认: true)
file_cleanup_enabled = true
# 下载单分片大小上限（字节）(默认: 5242880 即 5MB)
file_download_chunk_max = 5242880
# 上传单分片大小上限（字节）(默认: 5242880 即 5MB)
file_upload_chunk_max = 5242880
