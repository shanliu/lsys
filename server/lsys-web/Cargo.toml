[package]
name = "lsys-web"
version = "0.0.1"
authors = ["liushan <shan.liu@msn.com>"]
edition = "2021"


[dependencies]
futures-util = "0.3.*"
serde = { version = "1.0.*" }
serde_json = "1.0.*"
dotenv = "0.15.*"

tokio = { version = "~1.49.0", features = ["fs"] }
deadpool-redis = { version = "~0.23.0" }
redis = { version = "~1.0.3" }

async-recursion = "~1.1.1"

form_urlencoded = "~1.2.0"


pin-project-lite = "0.2.9"
#db
sqlx = { version = "~0.8.6", features = ["mysql", "runtime-tokio-native-tls"] }


#客户端
reqwest = { version = "~0.13.1", features = ["json", "stream"] }
rustls = { version = "~0.23.35", default-features = false, features = [
    "aws_lc_rs",
    "std",
    "tls12",
] }
chrono = { version = "~0.4.31" }
serde_urlencoded = "0.7"

url = "~2.5.7"

#日志
tracing = { version = "0.1.*" } # log-always 保持log的输出 当使用tracing时会出现两次

tera = "1.17.0"

parking_lot = "0.12.1"

fluent = "0.17.0"

mime = "0.3.16"

ip2location = "~0.6.0"

captcha = "1.0.0"

async-trait = "0.1.57"

config = "~0.15"

rand = "~0.10.0"

lsys-core = { path = "../lsys-core", features = ["db-mysql", "tera", "redis"] }
lsys-rbac = { path = "../lsys-rbac" }
lsys-access = { path = "../lsys-access" }
lsys-user = { path = "../lsys-user" }
lsys-app = { path = "../lsys-app" }
lsys-mfa = { path = "../lsys-mfa" }
lsys-app-sender = { path = "../lsys-app-sender", features = [
    "sms-aliyun",
    "sms-jdcloud",
    "sms-huawei",
    "sms-netease",
    "sms-tencent",
    "sms-cloopen",
    "sms-emay",
] }
lsys-setting = { path = "../lsys-setting" }
lsys-logger = { path = "../lsys-logger" }
lsys-files = { path = "../lsys-files" }
lsys-lib-jsrun = { path = "../lsys-lib-jsrun" }

lsys-lib-area = { default-features = false, features = [
    "data-csv",
    "index-disk",
], path = "../lsys-lib-area" }


base64 = { version = "~0.22.0" }
regex = "~1.12.2"
md5 = "~0.8"


[features]
default = []
